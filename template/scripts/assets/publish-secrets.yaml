name: Publish encrypted secrets

on:
  push:
    branches: [master, main]
    paths:
      - secrets/**
      - secrets-config.yaml
      - .sops.yaml
      - scripts/publish-secrets.py
      - .github/workflows/publish-secrets.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-encrypted-secrets
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install 'PyYAML>=6,<7'
          gh release download v3.13.3 --repo getsops/sops --pattern 'sops-v3.13.3.linux.amd64' --pattern 'sops-v3.13.3.checksums.txt' --dir "$RUNNER_TEMP/sops"
          cd "$RUNNER_TEMP/sops"
          sha256sum --check --ignore-missing sops-v3.13.3.checksums.txt
          mkdir -p "$HOME/.local/bin"
          install -m 0755 sops-v3.13.3.linux.amd64 "$HOME/.local/bin/sops"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Publish declared secrets
        env:
          GH_TOKEN: ${{ github.token }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: python scripts/publish-secrets.py --apply
