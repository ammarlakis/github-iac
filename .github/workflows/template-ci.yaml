name: Template CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Template validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false
      - name: Install validation dependencies
        run: python -m pip install 'copier==9.18.2' 'PyYAML>=6,<7' 'jsonschema>=4,<5'
      - name: Check formatting and shell syntax
        run: |
          terraform fmt -check template/src
          bash -n template/scripts/create-repo.sh
      - name: Validate schemas
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate rendered templates and Terraform plans
        run: python tests/validate_template.py
